<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+Pinstripe:ital@0;1&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
<link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <h1>Расписание уроков</h1>

    </header>
<div class="week-navigation">
    <button id="prevWeekBtn" class="nav-btn">
        <i class="fas fa-chevron-left"></i> <p>Предыдущая неделя</p>
    </button>
    <button id="todayWeekBtn" class="nav-btn today-btn">
        Сегодня
    </button>
    <button id="nextWeekBtn" class="nav-btn">
        <p>Следующая неделя</p> <i class="fas fa-chevron-right"></i>
    </button>
</div>
<main id="schedule-container"></main>
<div id="addinfoShadow">
<div id="addinfo">

    <div class="calendar">
        <button id="cross" style="height: 20px;width: 20px;">X</button>
        <div class="header">
            <button id="prevBtn">
                <i class="fa-solid fa-chevron-left"></i> 
            </button>
        <div class="monthYear" id="monthYear"></div> 
            <button id="nextBtn"> 
                <i class="fa-solid fa-chevron-right"></i> 
            </button>
    </div> 
        <div class="days"> 
            <div class="day">Пон</div> 
            <div class="day">Втр</div> 
            <div class="day">Срд</div> 
            <div class="day">Чтв</div> 
            <div class="day">Птн</div> 
            <div class="day">Сбт</div> 
            <div class="day">Вск</div> 
        </div> 
        <div class="dates" id="dates"></div> 
    </div>
</div>
</div>

<!-- Модальное окно для редактирования расписания -->
<div id="scheduleModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Редактирование расписания</h2>
            <span class="close">&times;</span>
        </div>
        <div class="modal-body">
            <div id="selectedDateDisplay" class="selected-date"></div>
            
            <div class="form-group">
                <label for="dayOfWeekSelect">День недели:</label>
                <select id="dayOfWeekSelect">
                    <option value="Понедельник">Понедельник</option>
                    <option value="Вторник">Вторник</option>
                    <option value="Среда">Среда</option>
                    <option value="Четверг">Четверг</option>
                    <option value="Пятница">Пятница</option>
                    <option value="Суббота">Суббота</option>
                    <option value="Воскресенье">Воскресенье</option>
                </select>
            </div>

            <div id="lessonsContainer" class="lessons-container">
                <!-- Уроки будут добавляться динамически -->
            </div>

            <button id="addLessonBtn" class="btn-add">+ Добавить урок</button>
            
            <div class="modal-actions">
                <button id="saveScheduleBtn" class="btn-save">Сохранить изменения</button>
                <button id="cancelScheduleBtn" class="btn-cancel">Отмена</button>
            </div>
        </div>
    </div>
</div>

    <script type="module" src="1.js"></script>
</body>
</html>
