<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната с сундуком</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body class="room-body">
    
    <div class="room-container">
        <div class="room">
             <div class="floor" style="clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);background: linear-gradient(31deg, rgb(101 75 61 / 83%) 0%, rgba(101 75 61 / 51%) 60%, rgba(255, 176, 123, 0) 100%);"></div>
             <div class="floor"style="height:100%;clip-path: polygon(0% 0%, 100% 0%, 85% 15%, 15% 15%);background: linear-gradient(31deg, rgb(101 75 61 / 83%) 0%, rgba(101 75 61 / 51%) 60%, rgba(255, 176, 123, 0) 100%);"></div>
             <div class="walls" style="clip-path: polygon(0% 0%, 15% 15%, 15% 65%, 0% 100%);background: linear-gradient(31deg, rgb(101 75 61 / 83%) 0%, rgba(101 75 61 / 51%) 60%, rgba(255, 176, 123, 0) 100%);"></div>
             <div class="walls" style="clip-path: polygon(85% 15%, 100% 0%, 100% 100%, 85% 65%);"></div>
        </div>
        <!-- Изначально показываем сундук (или комнату с открытым сундуком) -->
        <div class="chest-view active" id="chestView">
            <!-- Сюда вставишь картинку комнаты/сундука (пока заглушка) -->
            <img src="chest.webp" alt="Сундук" class="room-image" id="chestImg">
            <button class="bottom-btn" onclick="alert('Здесь будет переход куда-то дальше...')">Дальше</button>
        </div>

        <!-- Вид письма -->
                <!-- Вид 2: Письмо -->
        <div class="letter-view" id="letterView">
            <!-- Заглушка вместо картинки письма -->
                <img src="envelope.webp" class="letter-image">
            
            <!-- Кнопка "Отложить" (крестик) -->
            <button class="close-letter-btn" id="closeLetterBtn" title="Отложить письмо">
                <span></span>
                <span></span>
            </button>

            <!-- Кнопка-печать -->
            <img src="seal.webp" class="wax-seal-btn" id="waxSealBtn">
        </div>

        <!-- Кнопка-заглушка снизу (по дизайну как devTrigger) -->
    </div>

    <!-- Модальное окно для ввода имени предателя -->
    <div class="modal-overlay" id="nameModal">
        <div class="modal-content">
            <h2>Введите имя</h2>
            <p>Кто украл подарок?</p>
            <input type="text" id="traitorNameInput" placeholder="Имя предателя..." autocomplete="off">
            <div class="error-msg" id="nameError"></div>
            <button id="submitNameBtn">Проверить</button>
            <button id="closeNameBtn" class="btn-secondary">Отмена</button>
        </div>
    </div>

    <script src="room.js"></script>
</body>
</html>
